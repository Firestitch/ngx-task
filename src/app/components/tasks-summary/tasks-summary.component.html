<fs-list [config]="listConfig">
  <fs-list-column>
    <ng-template
        fs-list-cell
        let-row="row">
      <div class="task">
        <div class="task-name">
          <fs-activity-object-type
            [color]="'#60C5F1'"
            [icon]="'task_alt'">
          </fs-activity-object-type>
          <app-identifier-chip
            [identifier]="row.identifier"
            [name]="row.name"
            [size]="'tiny'">
          </app-identifier-chip>
          <a (click)="openTask(row)">
            {{ row.name }}
          </a>
          @if (row.taskStatus) {
            <app-task-status-chip
              [taskStatus]="row.taskStatus"
              [size]="'tiny'">
            </app-task-status-chip>
          }
        </div>
        <div class="small">
          {{ row.assignedAccount?.name }}
        </div>
      </div>
    </ng-template>
  </fs-list-column>
</fs-list>
